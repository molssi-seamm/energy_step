name: test

channels:
  - conda-forge

dependencies:
  # Base depends
  - python
  - pip

  # SEAMM
  - numpy

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pygments
  
  # Pip-only installs
  - pip:
    # SEAMM (pure Python; PyPI is never behind, conda-forge can lag)
    - seamm
    - seamm-mdi
    # Documentation
    - rinohtype
    - sphinx-rtd-theme
    - pystemmer
