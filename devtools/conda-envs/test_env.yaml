name: test

channels:
  - conda-forge

dependencies:
  # Base depends
  - python
  - pip

  # Compiled dependencies (openbabel/rdkit arrive with molsystem) from conda;
  # seamm itself comes from PyPI below because conda-forge lags PyPI by hours
  # and this step needs the newest seamm.
  # seamm.Node still uses the bibtexparser 1.x API (loads)
  - bibtexparser<2
  - molsystem
  - numpy

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pygments

  # Pip-only installs (pure Python; PyPI has a release within minutes of the tag)
  - pip:
    - seamm>=2026.9.18.1
    - seamm-mdi>=2026.9.18
    # Documentation
    - rinohtype
    - sphinx-rtd-theme
    - pystemmer
