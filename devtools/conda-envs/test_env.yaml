name: test

channels:
  - conda-forge

dependencies:
  # Base depends
  - python
  - pip

  # SEAMM (compiled deps such as openbabel/rdkit come with molsystem from conda)
  - seamm
  # seamm.Node still uses the bibtexparser 1.x API (loads)
  - bibtexparser<2
  - molsystem
  - numpy

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pygments

  # Pip-only installs (pure Python; PyPI has a release within minutes of the tag)
  - pip:
    - seamm-mdi
    # Documentation
    - rinohtype
    - sphinx-rtd-theme
    - pystemmer
